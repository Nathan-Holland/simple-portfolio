<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nate Holland</title>
<meta name="description" content="Nate Holland is a British designer based in Barcelona, leading Retail and Trust design at Revolut.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #fff; --ink: #000; --mute: #8a8a8a; --line: rgb(0 0 0 / .35); }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0b; --ink: #f2f2f2; --mute: #8a8a8a; --line: rgb(255 255 255 / .4); } }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; padding: 16px;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 400px; }
  h1 { margin: 0; font: inherit; }
  .updated { margin: 0 0 32px; color: var(--mute); }
  p { margin: 0 0 14px; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; transition: text-decoration-color .2s; }
  a:hover { text-decoration-color: currentColor; }
  a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 2px; }
  .lock { color: var(--mute); }
  @media (prefers-reduced-motion: no-preference) {
    main > * { animation: in .7s cubic-bezier(.2, .7, .2, 1) both; }
    main > :nth-child(2) { animation-delay: .05s; } main > :nth-child(3) { animation-delay: .12s; }
    main > :nth-child(4) { animation-delay: .18s; } main > :nth-child(5) { animation-delay: .24s; }
    main > :nth-child(6) { animation-delay: .3s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  }
</style>
</head>
<body>
  <main>
    <h1>Nate Holland</h1>
    <p class="updated">Updated 14 November 2026</p>

    <p>Hi, hola.</p>
    <p>I’m a British designer based in Barcelona, currently leading Retail and Trust design at Revolut.</p>
    <p>You can view my work <a href="/work.html">here</a>. It’s password protected, so if you’d like access, send me a message.</p>
    <p>You can find me on <a href="https://x.com/nateh0lland" target="_blank" rel="noopener">X</a>, <a href="https://www.instagram.com/nateh0lland/" target="_blank" rel="noopener">Instagram</a> or <a href="https://www.linkedin.com/in/nathan-holland-59980995/" target="_blank" rel="noopener">LinkedIn</a>.</p>
  </main>
</body>
</html>
