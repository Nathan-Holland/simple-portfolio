<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Nate Holland</title>
<link rel="stylesheet" href="styles.css?v=63">
<link rel="icon" href="favicon.svg">
</head>
<body>

  <script>
    var dq = window.matchMedia("(prefers-color-scheme: dark)");
    var storedDark = localStorage.getItem("dark");
    document.body.classList.toggle("dark", storedDark === null ? dq.matches : storedDark === "1");
  </script>

  <div class="loader" id="loader">
    <div class="loader-bar-row">
      <span class="loader-name" id="loaderName">Nate Holland</span>
      <div class="loader-bar-track"><div class="loader-bar-fill" id="loaderBarFill"></div></div>
      <span class="loader-pct" id="loaderPct">0%</span>
    </div>
  </div>
  <script>
    if (sessionStorage.getItem("skipLoader")) {
      sessionStorage.removeItem("skipLoader");
      document.getElementById("loader").remove();
    }
  </script>

  <div id="smooth-wrapper">
    <div id="smooth-content">

      <header class="nav">
        <a href="index.html" class="nav-name">Nate Holland</a>
        <a href="profile.html" class="nav-profile"><span class="nav-word-flip"><span class="nav-word nav-word-front">Profile</span><span class="nav-word nav-word-back">Work</span></span></a>
        <button type="button" class="nav-logo" id="darkToggle" aria-label="Toggle dark mode"><img src="logo.svg" alt=""></button>
        <a href="mailto:nathanholland14@gmail.com" class="nav-email">Email me</a>
        <span class="nav-clock clock-el">—</span>
      </header>

      <div class="page-content">

      <main class="work-grid grid14"></main>

      <footer>
        <span class="footer-year"><img class="footer-icon" src="logo.svg" alt="">2026</span>
        <a href="#">Instagram</a>
        <a href="#">Twitter (X)</a>
        <span class="clock-el">—</span>
      </footer>

      </div>

    </div>
  </div>

  <div class="case-modal" id="caseModal" aria-hidden="true">
    <div class="case-modal-backdrop" id="caseModalBackdrop"></div>
    <div class="case-modal-scroll" id="caseModalScroll">
      <div class="case-modal-hero" id="caseModalHero">
        <div class="case-modal-hero-media" id="caseModalHeroMedia"></div>
        <button type="button" class="case-modal-close" id="caseModalClose" aria-label="Close case study">×</button>
      </div>

      <div class="case-modal-body" id="caseModalBody">
        <section class="case-meta grid14">
          <div class="case-meta-info">
            <p class="case-meta-year">© 2026</p>
            <div class="case-meta-item">
              <p class="case-meta-label">Client</p>
              <p class="case-meta-value" id="caseModalClient">Client Name</p>
            </div>
            <div class="case-meta-item">
              <p class="case-meta-label">Partner</p>
              <p class="case-meta-value" id="caseModalPartner">Partner Name</p>
            </div>
          </div>
          <p class="case-intro" id="caseModalIntro"></p>
        </section>

        <section class="case-gallery" id="caseGallery"></section>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@latest/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@latest/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@latest/dist/ScrollSmoother.min.js"></script>
  <script src="script.js?v=62"></script>
</body>
</html>
