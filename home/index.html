<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Nate Holland | Home</title>
  <link rel="icon" href="/wishlist/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/nh.css?v=2" />
  <style>
    /* Cards design system (cards.uidesigncourse.com): tokens live in /shared/nh.css */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow-x: clip;
      background: var(--canvas);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.006em;
      -webkit-font-smoothing: antialiased;
    }
    svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    button, input { font: inherit; color: inherit; letter-spacing: inherit; }
    [hidden] { display: none !important; }
    .muted { color: var(--fg-muted); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .clock { font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--fg-muted); }

    /* ---------- layout: main column + sidebar ---------- */
    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 16px 64px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      grid-template-areas: "main side";
      gap: 48px;
      align-items: start;
    }
    .main { grid-area: main; min-width: 0; display: grid; gap: 32px; }
    .side { grid-area: side; display: grid; gap: 32px; position: sticky; top: 16px; }

    .greet .nh-eyebrow { margin-bottom: 8px; }
    .greet h1 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 40px; line-height: 48px; letter-spacing: -0.01em; }

    /* Cards: white, one small shadow, no border */
    .card { background: var(--surface); border-radius: var(--radius-2xl); box-shadow: var(--shadow-sm); }
    .divider { height: 1px; background: var(--line); margin: 0 -20px; }
    /* Section headings sit on the canvas (heading-6); group labels inside cards are overline-xs */
    .label { margin: 0 0 12px; font-family: var(--font-display); font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: 0; color: var(--fg); }
    .card .label, .lbl { margin: 0; font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0; color: var(--fg-muted); }

    /* Buttons: white control or solid primary; hover shifts colour, press squeezes, focus sharpens */
    .pill-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      height: 32px; padding: 0 16px; border: 0; border-radius: 999px; cursor: pointer;
      font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none; white-space: nowrap;
      color: var(--fg); background: var(--control); box-shadow: var(--shadow-button);
      transition: background-color .15s var(--ease-tactile), box-shadow .15s, scale .15s var(--ease-tactile);
    }
    .pill-btn:has(> svg:first-child) { padding-left: 12px; }
    .pill-btn:hover { background: var(--control-hover); }
    .pill-btn:active { scale: .97; }
    .pill-btn:focus-visible { outline: 2px solid var(--line-focus); outline-offset: 2px; }
    .pill-btn svg { width: 16px; height: 16px; stroke-width: 2.25; color: var(--fg-subtle); }
    .pill-btn.dark, .pill-btn[aria-pressed="true"] { background: var(--primary); color: #fff; box-shadow: var(--shadow-primary); }
    .pill-btn.dark:hover, .pill-btn[aria-pressed="true"]:hover { background: var(--primary-hover); }
    .pill-btn.dark svg, .pill-btn[aria-pressed="true"] svg { color: currentColor; }

    /* ---------- search: a text field ---------- */
    .search-box {
      display: flex; align-items: center; gap: 8px;
      height: 48px; padding: 0 8px 0 16px;
      background: var(--field); border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xs), inset 0 0 0 1px var(--line);
      transition: box-shadow .15s var(--ease-tactile);
    }
    .search-box:hover { box-shadow: var(--shadow-xs), inset 0 0 0 1px var(--line-strong); }
    .search-box:focus-within { box-shadow: var(--shadow-focus), inset 0 0 0 1px var(--line-focus); }
    .search-box > svg { width: 20px; height: 20px; color: var(--fg-subtle); flex: none; }
    .search-box input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font-size: 16px; line-height: 24px; letter-spacing: -0.011em; outline: none; }
    .search-box input::placeholder { color: var(--fg-subtle); }
    .search-box input::-webkit-search-cancel-button { display: none; }
    .search-box button {
      flex: none; width: 32px; height: 32px; border: 0; border-radius: var(--radius-sm);
      background: var(--primary); color: #fff; box-shadow: var(--shadow-primary);
      display: grid; place-items: center; cursor: pointer;
      transition: background-color .15s, scale .15s var(--ease-tactile);
    }
    .search-box button:hover { background: var(--primary-hover); }
    .search-box button:active { scale: .94; }
    .search-box button:focus-visible { outline: 2px solid var(--line-focus); outline-offset: 2px; }
    .search-box button svg { width: 16px; height: 16px; stroke-width: 2.25; }

    /* ---------- shortcuts: your apps, then other sites ---------- */
    .shortcuts { padding: 8px; display: grid; margin-top: -16px; }
    .quick { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
    .quick + .quick { border-top: 1px solid var(--line); margin: 8px -8px 0; padding: 8px 8px 0; }
    .quick a {
      display: grid; justify-items: center; gap: 8px; padding: 12px 4px; border-radius: var(--radius-sm);
      color: var(--fg-muted); text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 500;
      transition: background-color .15s, color .15s;
    }
    .quick a:hover { background: var(--hover); color: var(--fg); }
    .quick a:focus-visible { outline: 2px solid var(--line-focus); outline-offset: -2px; }
    .quick .qi { width: 40px; height: 40px; border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-button); display: grid; place-items: center; }
    .quick .qi svg { width: 20px; height: 20px; color: var(--fg-muted); }
    .quick a:hover .qi svg { color: var(--fg); }
    .quick .qi svg.logo { width: 16px; height: 16px; fill: var(--fg); stroke: none; }
    .quick .qi img { width: 20px; height: 20px; border-radius: var(--radius-xs); }
    .quick .qn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 520px) { .quick { grid-template-columns: repeat(4, minmax(0, 1fr)); } .shortcuts { margin-top: -16px; } }

    /* ---------- Español: phrase of the day + today's task ---------- */
    .es { padding: 20px; display: grid; gap: 20px; }
    .es .phrase, .es .task { display: grid; gap: 8px; align-content: start; min-width: 0; }
    .phrase .es-text { margin: 4px 0 0; font-family: var(--font-display); font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: 0; }
    .phrase .en { margin: 0; font-size: 14px; line-height: 20px; }
    .phrase .note { margin: 0; color: var(--fg-muted); }
    .phrase .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .task .what { margin: 4px 0 0; font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: -0.011em; }
    .task .what small { display: block; margin-top: 4px; font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: -0.006em; color: var(--fg-muted); }
    .task .checks { list-style: none; margin: 4px -8px 0; padding: 0; display: grid; gap: 4px; }
    .task .checks a { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: var(--radius-lg); color: inherit; text-decoration: none; transition: background-color .15s; }
    .task .checks a:hover { background: var(--hover); }
    .task .checks a:focus-visible { outline: 2px solid var(--line-focus); outline-offset: -2px; }
    .task .checks .box { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-xs), inset 0 0 0 1px var(--line-strong); display: grid; place-items: center; }
    .task .checks .done .box { background: var(--primary); box-shadow: none; color: #fff; }
    .task .checks .box svg { width: 12px; height: 12px; stroke-width: 2.4; }
    .task .checks .done .lbl { color: var(--fg-muted); text-decoration: line-through; font-size: 14px; line-height: 20px; font-weight: 400; }
    .task .checks .meta { margin-left: auto; font-size: 12px; line-height: 16px; color: var(--fg-subtle); }
    .task .go { margin-top: 8px; justify-self: start; }

    /* ---------- news ---------- */
    .news-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .news-head .label { margin: 0; }
    /* Segmented control: tray with concentric triggers (8 − 4 = 4px) */
    .seg { display: inline-flex; padding: 4px; border-radius: var(--radius-lg); background: var(--tray); gap: 4px; }
    .seg button {
      height: 28px; border: 0; background: transparent; padding: 0 12px; border-radius: 4px;
      color: var(--fg-muted); cursor: pointer; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap;
      transition: color .15s, background-color .15s, box-shadow .15s;
    }
    .seg button:hover { color: var(--fg); }
    .seg button[aria-selected="true"] { background: var(--raised); color: var(--fg); box-shadow: var(--shadow-sm); }
    .seg button:focus-visible { outline: 2px solid var(--line-focus); outline-offset: 2px; }
    .news { display: grid; gap: 24px; }
    .story {
      display: grid; gap: 12px; align-content: start; padding: 8px;
      border-radius: var(--radius-2xl); background: var(--surface); box-shadow: var(--shadow-sm);
      color: inherit; text-decoration: none; outline: none;
      transition: background-color .15s;
    }
    .story:hover { background: var(--control-hover); }
    .story:hover .t { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
    .story:focus-visible { outline: 2px solid var(--line-focus); outline-offset: 2px; }
    /* Images hug the card: 13 − 8 = 5px corners. Missing images get a sky gradient, never a grey box. */
    .story .img { position: relative; aspect-ratio: 16 / 10; border-radius: var(--radius-sm); overflow: hidden; background: linear-gradient(to bottom in oklab, #9CC4E8, #F1F5F8); }
    .story .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .story .img .fallback { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--fg-muted); }
    .story .body { display: grid; gap: 4px; padding: 0 8px 8px; min-width: 0; }
    .story .m { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
    .story .m b { font-weight: 500; color: var(--fg); }
    .story .t { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: -0.011em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .story .s { margin: 0; color: var(--fg-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .story.lead { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: center; }
    .story.lead .body { padding: 8px 12px 8px 0; gap: 8px; }
    .story.lead .t { font-family: var(--font-display); font-size: 20px; line-height: 28px; letter-spacing: 0; -webkit-line-clamp: 3; }
    .news .rest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .news .rest .story { grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 12px; }
    .news .rest .story .img { aspect-ratio: 1 / 1; }
    .news .rest .story .body { padding: 0 4px 0 0; }
    .news .rest .story .t { font-size: 14px; line-height: 20px; letter-spacing: -0.006em; }
    .news-msg { margin: 0; padding: 32px 20px; border-radius: var(--radius-2xl); background: var(--surface); box-shadow: var(--shadow-sm); color: var(--fg-muted); text-align: center; }
    .skeleton { height: 16px; border-radius: var(--radius-sm); background: linear-gradient(90deg, var(--subtle), var(--line), var(--subtle)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ---------- Today card: weather, training, WeightWise ---------- */
    .today { padding: 20px; display: grid; gap: 20px; }
    .weather { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 12px; align-items: center; }
    .weather .wi { grid-row: 1 / span 2; width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); color: var(--fg-muted); display: grid; place-items: center; }
    .weather .wi svg { width: 20px; height: 20px; }
    .weather .temp { font-size: 24px; line-height: 32px; font-weight: 500; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; }
    .weather .temp small { font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: 0; color: var(--fg-muted); margin-left: 8px; }
    .weather .desc { color: var(--fg-muted); font-size: 12px; line-height: 16px; }
    .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .fact { background: var(--subtle); border-radius: var(--radius-lg); padding: 8px 12px; display: grid; gap: 0; min-width: 0; }
    .fact .l { font-size: 12px; line-height: 16px; color: var(--fg-muted); }
    .fact .v { font-size: 14px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ww { display: grid; gap: 8px; color: inherit; text-decoration: none; border-radius: var(--radius-lg); margin: -8px; padding: 8px; transition: background-color .15s; }
    .ww:hover { background: var(--hover); }
    .ww:focus-visible { outline: 2px solid var(--line-focus); outline-offset: 0; }
    .ww-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .ww-top .muted { font-size: 12px; line-height: 16px; font-weight: 500; }
    .ww .kg { font-size: 24px; line-height: 32px; font-weight: 500; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; }
    .ww .kg small { font-size: 14px; letter-spacing: 0; font-weight: 400; color: var(--fg-muted); margin-left: 4px; }
    .ww .togo { font-size: 12px; line-height: 16px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
    .ww .bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .ww .bar span { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--primary); transition: width .6s var(--ease-tactile); }
    .due { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 500; }
    .due::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-subtle); }
    .due:empty { display: none; }
    .due.now { color: var(--danger-fg); }
    .due.now::before { background: var(--danger); }
    .due.done { color: var(--success-fg); }
    .due.done::before { background: var(--success); }

    /* Training: push / pull / legs / upper / lower */
    .train { display: grid; gap: 16px; }
    .train-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .train-now { min-width: 0; display: grid; gap: 4px; }
    .train-now .what { margin: 0; font-family: var(--font-display); font-size: 20px; line-height: 28px; font-weight: 500; }
    .train-now .focus { margin: 0; font-size: 12px; line-height: 16px; color: var(--fg-muted); }
    .train-btn { flex: none; }
    .train-btn.done { background: var(--success-subtle); color: var(--success-fg); box-shadow: 0 0 0 1px var(--success-line); }
    .train-btn.done:hover { background: var(--success-line); }
    .train-btn.done svg { color: currentColor; }
    .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0 -4px; }
    .day {
      display: grid; justify-items: center; gap: 4px; padding: 8px 0; border: 0; border-radius: var(--radius-lg);
      background: none; font-size: 11px; line-height: 12px; font-weight: 500; color: var(--fg-subtle); cursor: default;
      transition: background-color .15s;
    }
    .day.can { cursor: pointer; color: var(--fg-muted); }
    .day.can:hover { background: var(--hover); }
    .day:focus-visible { outline: 2px solid var(--line-focus); outline-offset: -2px; }
    .day .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line-strong); color: transparent; }
    .day .dot svg { width: 12px; height: 12px; stroke-width: 2.6; }
    .day .s { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; }
    .day.rest .dot { box-shadow: none; }
    .day.rest .dot::before { content: ""; width: 8px; height: 1px; background: var(--line-strong); }
    .day.today { color: var(--fg); }
    .day.today .dot { box-shadow: inset 0 0 0 2px var(--fg); }
    .day.done .dot { background: var(--primary); box-shadow: none; color: #fff; }
    .day.missed .dot { box-shadow: inset 0 0 0 1px var(--danger-line); }
    .day.missed .s { color: var(--danger-fg); }
    .train-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; line-height: 16px; color: var(--fg-muted); }
    .train-foot b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
    .train-meter { flex: 1; max-width: 120px; height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .train-meter span { display: block; height: 100%; border-radius: inherit; background: var(--primary); transition: width .6s var(--ease-tactile); }

    /* ---------- responsive ---------- */
    @media (max-width: 900px) {
      .page { grid-template-columns: minmax(0, 1fr); grid-template-areas: "main" "side"; gap: 32px; padding-top: 24px; }
      .side { position: static; }
      /* On phones the summary comes before the news */
      .main { display: contents; }
      .greet { order: 1; } .search-wrap, .shortcuts { order: 2; } .side { order: 4; } .news-wrap { order: 5; }
      .page { display: flex; flex-direction: column; align-items: stretch; }
    }
    @media (max-width: 520px) {
      .greet h1 { font-size: 32px; line-height: 40px; }
      .news-head { flex-direction: column; align-items: flex-start; }
      .story.lead { grid-template-columns: 1fr; gap: 12px; }
      .story.lead .body { padding: 0 8px 8px; }
      .news .rest { grid-template-columns: 1fr; }
      .news .rest .story { grid-template-columns: 88px minmax(0, 1fr); }
      .search-box { height: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
      .pill-btn, .search-box button { transition: none; }
    }
  </style>
</head>
<body>
  <header class="nh-top" style="justify-content: flex-end">
    <span class="clock" id="clock"></span>
  </header>

  <div class="page">
    <div class="main">
      <section class="greet">
        <p class="nh-eyebrow">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg>
          <span id="date">Today</span>
        </p>
        <h1 id="greeting">Hello, Nate</h1>
      </section>

      <form class="search-wrap" action="https://www.google.com/search" method="get" role="search">
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></svg>
          <span class="visually-hidden">Search Google</span>
          <input type="search" name="q" placeholder="Search Google" autocomplete="off" autofocus />
          <button type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </button>
        </label>
      </form>

      <!-- Your apps, then quick links to other sites: add or remove a line to change them -->
      <nav class="card shortcuts" aria-label="Shortcuts">
        <ul class="quick apps" aria-label="Your apps">
          <li><a href="/wishlist"><span class="qi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg></span><span class="qn">Wishlist</span></a></li>
          <li><a href="/bookmarks"><span class="qi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h10a1 1 0 0 1 1 1V20l-6-4-6 4V5.5a1 1 0 0 1 1-1z" /></svg></span><span class="qn">Bookmarks</span></a></li>
          <li><a href="/weight"><span class="qi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4" /></svg></span><span class="qn">WeightWise</span></a></li>
          <li><a href="/budget"><span class="qi"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 3.5V12l6 6" /></svg></span><span class="qn">Budget</span></a></li>
          <li><a href="/spanish"><span class="qi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h9a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z" /><path d="M5 17a3 3 0 0 1 3-3h9" /></svg></span><span class="qn">Spanish</span></a></li>
          <li><a href="/wedding"><span class="qi"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="14" r="5" /><circle cx="15" cy="14" r="5" /><path d="m10 5 2-2 2 2" /></svg></span><span class="qn">Wedding</span></a></li>

  <script src="/home/phrases.js"></script>

  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

    // ---------- greeting + clock ----------
    function tick() {
      var now = new Date(), h = now.getHours();
      $("greeting").textContent = h < 5 ? "Late one, Nate" : h < 12 ? "Good morning, Nate" : h < 18 ? "Good afternoon, Nate" : "Good evening, Nate";
      $("date").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
      $("clock").textContent = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    }
    tick();
    setInterval(tick, 10000);

    // ---------- weather (Open-Meteo, Barcelona) ----------
    var ICONS = {
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
      moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
      partly: '<path d="M8 3.5v1.5M3.5 8H5M4.8 4.8l1 1M11.2 4.8l-1 1"/><path d="M5.3 10.5A3.5 3.5 0 0 1 11.5 7"/><path d="M8 19.5h9.5a3.5 3.5 0 0 0 .2-7 5 5 0 0 0-9.6 1.2A3 3 0 0 0 8 19.5z"/>',
      cloud: '<path d="M7 18.5h10a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.4A3.3 3.3 0 0 0 7 18.5z"/>',
      fog: '<path d="M4 10h16M6 14h12M8 18h8"/><path d="M7 6.5a5 5 0 0 1 9.5 0"/>',
      rain: '<path d="M7 15.5h10a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.4A3.3 3.3 0 0 0 7 15.5z"/><path d="m9 18-1 2.5M13 18l-1 2.5M17 18l-1 2.5"/>',
      snow: '<path d="M7 15h10a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.4A3.3 3.3 0 0 0 7 15z"/><path d="M9 18.5h.01M12 20h.01M15 18.5h.01"/>',
      storm: '<path d="M7 15h10a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.4A3.3 3.3 0 0 0 7 15z"/><path d="m12.5 15-2 3.5h3l-2 3"/>',
    };
    function wmo(code, day) {
      if (code === 0) return [day ? "sun" : "moon", "Clear"];
      if (code <= 2) return [day ? "partly" : "cloud", code === 1 ? "Mostly clear" : "Partly cloudy"];
      if (code === 3) return ["cloud", "Cloudy"];
      if (code <= 48) return ["fog", "Fog"];
      if (code <= 57) return ["rain", "Drizzle"];
      if (code <= 67) return ["rain", "Rain"];
      if (code <= 77) return ["snow", "Snow"];
      if (code <= 82) return ["rain", "Showers"];
      if (code <= 86) return ["snow", "Snow showers"];
      return ["storm", "Thunderstorms"];
    }
    function hhmm(isoLocal) { return isoLocal ? isoLocal.slice(11, 16) : "—"; }
    fetch("https://api.open-meteo.com/v1/forecast?latitude=41.39&longitude=2.17&timezone=Europe%2FMadrid&forecast_days=1" +
      "&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m" +
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunset")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        var c = d.current, dy = d.daily, w = wmo(c.weather_code, c.is_day === 1);
        var hi = Math.round(dy.temperature_2m_max[0]), lo = Math.round(dy.temperature_2m_min[0]);
        $("weather").innerHTML =
          '<span class="wi" aria-hidden="true"><svg viewBox="0 0 24 24">' + ICONS[w[0]] + "</svg></span>" +
          '<span class="temp">' + Math.round(c.temperature_2m) + "°<small>" + hi + "° / " + lo + "°</small></span>" +
          '<span class="desc">' + w[1] + " in Barcelona · feels " + Math.round(c.apparent_temperature) + "°</span>";
        $("weatherFacts").innerHTML =
          '<div class="fact"><span class="l">Rain</span><span class="v">' + (dy.precipitation_probability_max[0] ?? "—") + "%</span></div>" +
          '<div class="fact"><span class="l">Wind</span><span class="v">' + Math.round(c.wind_speed_10m) + " km/h</span></div>" +
          '<div class="fact"><span class="l">Sunset</span><span class="v">' + hhmm(dy.sunset[0]) + "</span></div>";
        $("weatherFacts").hidden = false;
      })
      .catch(function () {
        $("weather").innerHTML = '<span class="wi" aria-hidden="true"><svg viewBox="0 0 24 24">' + ICONS.cloud + '</svg></span><span class="temp muted">—</span><span class="desc">Weather unavailable right now</span>';
      });

    // ---------- WeightWise ----------
    var DAY = 86400000;
    function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
    function shortDate(s) { return parse(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); }
    function renderWeight(data) {
      var p = data && data.profile, ck = (data && data.checkins) || [];
      if (!p || !ck.length) {
        $("wwDue").className = "due";
        $("wwDue").textContent = "";
        $("wwKg").innerHTML = '<span style="font-size:14px;line-height:20px;letter-spacing:-0.006em">Set up WeightWise</span>';
        $("wwTogo").textContent = "→";
        return;
      }
      ck = ck.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
      var imp = p.units === "imperial", f = imp ? 2.20462 : 1, u = imp ? "lbs" : "kg";
      var L = ck[ck.length - 1], F = ck[0], t = iso(new Date());
      var next = iso(new Date(parse(L.date).getTime() + 7 * DAY));
      var due = L.date === t ? ["done", "Logged today"] : next <= t ? ["now", "Check-in due"] : ["", "Next " + shortDate(next)];
      $("wwDue").className = "due " + due[0];
      $("wwDue").textContent = due[1];
      $("wwKg").innerHTML = (L.kg * f).toFixed(1) + "<small>" + u + "</small>";
      var losing = (p.start_weight_kg != null ? p.start_weight_kg : F.kg) >= p.target_weight_kg;
      var left = Math.abs(L.kg - p.target_weight_kg), span = Math.abs(F.kg - p.target_weight_kg);
      var reached = losing ? L.kg <= p.target_weight_kg + 0.05 : L.kg >= p.target_weight_kg - 0.05;
      $("wwTogo").textContent = reached ? "Goal reached" : (left * f).toFixed(1) + " " + u + " to go";
      var pct = reached ? 100 : span > 0 ? Math.max(0, Math.min(100, (span - left) / span * 100)) : 0;
      requestAnimationFrame(function () { requestAnimationFrame(function () { $("wwBar").style.width = pct + "%"; }); });
    }
    function localWeight() { try { return JSON.parse(localStorage.getItem("weightwise-v1") || "null"); } catch (e) { return null; } }
    fetch("/api/store?doc=weight", { cache: "no-store", credentials: "same-origin" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { renderWeight(j.data || localWeight()); })
      .catch(function () { renderWeight(localWeight()); });

    // ---------- Training: 5 days a week, push / pull / legs / upper / lower ----------
    // Synced through /api/store?doc=workouts, with a copy in this browser (newest wins).
    (function () {
      var PLAN = { 1: "Push", 2: "Pull", 3: "Legs", 5: "Upper", 6: "Lower" }; // getDay(): Mon=1 … Sat=6
      var FOCUS = {
        Push: "Chest, shoulders and triceps",
        Pull: "Back, rear delts and biceps",
        Legs: "Quads, hamstrings, glutes and calves",
        Upper: "Chest, back, shoulders and arms",
        Lower: "Legs and core"
      };
      var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      var KEY = "workouts-v1";
      var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
      var state = { log: [], updated: null };
      try { var local = JSON.parse(localStorage.getItem(KEY) || "null"); if (local && Array.isArray(local.log)) state = local; } catch (e) { /* ignore */ }

      function doneOn(date) { return state.log.some(function (w) { return w.date === date; }); }
      function monday(d) { var m = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }
      function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
      function nextSession(from) {
        for (var i = 1; i <= 7; i++) { var d = addDays(from, i); if (PLAN[d.getDay()]) return { day: d, name: PLAN[d.getDay()], offset: i }; }
      }

      function render() {
        var now = new Date(), today = iso(now), todayName = PLAN[now.getDay()];
        var start = monday(now), planned = 0, done = 0;
        var cells = "";
        for (var i = 0; i < 7; i++) {
          var d = addDays(start, i), key = iso(d), name = PLAN[d.getDay()], isDone = doneOn(key);
          var past = key < today, isToday = key === today;
          if (name) { planned++; if (isDone) done++; }
          var cls = "day" + (name ? "" : " rest") + (isToday ? " today" : "") + (isDone ? " done" : name && past ? " missed" : "") + (name && !(key > today) ? " can" : "");
          var label = DAYS[d.getDay()] + ": " + (name || "Rest") + (isDone ? ", done" : name && past ? ", missed" : "");
          cells += '<button type="button" class="' + cls + '" data-date="' + key + '" aria-label="' + label + '"' + (name && !(key > today) ? ' aria-pressed="' + isDone + '"' : " disabled") + ">" +
            '<span class="d">' + DAYS[d.getDay()].slice(0, 3) + '</span><span class="dot">' + (isDone ? CHECK : "") + '</span><span class="s">' + (name || "Rest") + "</span></button>";
        }

        var top;
        if (todayName) {
          var did = doneOn(today);
          top = '<div class="train-now"><p class="lbl">Training</p><p class="what">' + todayName + ' day</p><p class="focus">' + FOCUS[todayName] + "</p></div>" +
            '<button type="button" class="pill-btn train-btn' + (did ? " done" : " dark") + '" data-date="' + today + '" aria-pressed="' + did + '">' +
            (did ? CHECK + "Done" : "Mark done") + "</button>";
        } else {
          var n = nextSession(now);
          top = '<div class="train-now"><p class="lbl">Training</p><p class="what">Rest day</p><p class="focus">Next: ' + n.name + " " + (n.offset === 1 ? "tomorrow" : "on " + DAYS[n.day.getDay()]) + "</p></div>";
        }
        $("train").innerHTML =
          '<div class="train-top">' + top + "</div>" +
          '<div class="week">' + cells + "</div>" +
          '<div class="train-foot"><span><b>' + done + " of " + planned + "</b> this week</span>" +
          '<span class="train-meter" aria-hidden="true"><span style="width:' + Math.round((done / planned) * 100) + '%"></span></span></div>';
      }

      function toggle(date) {
        var name = PLAN[new Date(date + "T12:00:00").getDay()];
        if (!name || date > iso(new Date())) return;
        if (doneOn(date)) state.log = state.log.filter(function (w) { return w.date !== date; });
        else state.log = state.log.concat([{ date: date, session: name }]).sort(function (a, b) { return a.date.localeCompare(b.date); });
        state.updated = new Date().toISOString();
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
        render();
        push();
      }
      function push() {
        fetch("/api/store?doc=workouts", { method: "PUT", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ log: state.log }) })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) { if (j && j.updated) { state.updated = j.updated; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } } })
          .catch(function () { /* stays in this browser until the next save works */ });
      }

      $("train").addEventListener("click", function (e) {
        var b = e.target.closest("[data-date]");
        if (b && !b.disabled) toggle(b.dataset.date);
      });

      render();
      fetch("/api/store?doc=workouts", { cache: "no-store", credentials: "same-origin" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (j) {
          var remote = j.data;
          if (remote && Array.isArray(remote.log) && (!state.updated || (remote.updated && remote.updated >= state.updated))) {
            state = { log: remote.log, updated: remote.updated };
            try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
            render();
          } else if (state.updated) {
            push(); // this browser has newer changes that never reached the server
          }
        })
        .catch(function () { /* offline or signed out: use this browser's copy */ });
      // Keep the week right when the page stays open past midnight
      document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });
    })();

    // ---------- Spanish: phrase of the day ----------
    (function () {
      var list = window.NH_PHRASES || [];
      if (!list.length) { document.querySelector(".es-wrap").hidden = true; return; }
      var now = new Date();
      var dayNo = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
      var ph = list[dayNo % list.length];
      var canSpeak = "speechSynthesis" in window;
      $("phrase").innerHTML =
        '<p class="label" style="margin:0">Frase del día</p>' +
        '<p class="es-text" lang="es">' + esc(ph[0]) + "</p>" +
        '<p class="en">' + esc(ph[1]) + "</p>" +
        '<p class="note">' + esc(ph[2]) + "</p>" +
        '<div class="row">' +
          (canSpeak ? '<button class="pill-btn" type="button" id="say" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>Hear it</button>' : "") +
          '<button class="pill-btn" type="button" id="copyPhrase"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Copy</button>' +
        "</div>";
      if (canSpeak) {
        $("say").addEventListener("click", function () {
          var b = this;
          speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(ph[0].replace(/…/g, ""));
          u.lang = "es-ES";
          u.rate = 0.9;
          var v = speechSynthesis.getVoices().filter(function (x) { return x.lang === "es-ES"; })[0];
          if (v) u.voice = v;
          b.setAttribute("aria-pressed", "true");
          u.onend = u.onerror = function () { b.setAttribute("aria-pressed", "false"); };
          speechSynthesis.speak(u);
        });
      }
      $("copyPhrase").addEventListener("click", function () {
        var b = this;
        if (navigator.clipboard) navigator.clipboard.writeText(ph[0]).then(function () {
          b.lastChild.textContent = "Copied";
          setTimeout(function () { b.lastChild.textContent = "Copy"; }, 1500);
        }, function () {});
      });
    })();

    // ---------- Spanish: today's task, read from Cuaderno (same site, so same browser database) ----------
    var TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>';
    function todayISO() { return iso(new Date()); }
    function openCuaderno() {
      // Opens the existing database read-only; never creates it if Cuaderno hasn't been used here
      return new Promise(function (resolve) {
        var req;
        try { req = indexedDB.open("cuaderno"); } catch (e) { return resolve(null); }
        req.onupgradeneeded = function () { req.transaction.abort(); };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { resolve(null); };
        req.onblocked = function () { resolve(null); };
      });
    }
    function getAll(db, store) {
      return new Promise(function (resolve) {
        if (!db.objectStoreNames.contains(store)) return resolve([]);
        var r = db.transaction(store, "readonly").objectStore(store).getAll();
        r.onsuccess = function () { resolve(r.result || []); };
        r.onerror = function () { resolve([]); };
      });
    }
    async function loadSpanish() {
      var box = $("esTask");
      var db = await openCuaderno();
      if (!db) {
        box.innerHTML = '<p class="label" style="margin:0">Today’s Spanish</p><p class="what">Add your first lesson in Cuaderno<small>Your homework and daily practice will show up here.</small></p>' +
          '<a class="pill-btn dark go" href="/spanish/#/lessons/new">Open Cuaderno</a>';
        return;
      }
      var res = await Promise.all([getAll(db, "homework"), getAll(db, "sessions"), getAll(db, "journal"), getAll(db, "lessons")]);
      db.close();
      var homework = res[0].filter(function (h) { return h.status === "open"; });
      var start = new Date(); start.setHours(0, 0, 0, 0);
      var practised = res[1].some(function (s) { return s.finishedAt && s.startedAt >= start.getTime(); });
      var journaled = res[2].some(function (j) { return j.date === todayISO() && j.checkedAt; });
      var lessons = res[3].length;

      // The one thing to do next: homework first, then practice, then the journal
      var next;
      if (homework.length) {
        var hw = homework[0];
        next = { what: hw.task, sub: "Homework" + (homework.length > 1 ? " · " + (homework.length - 1) + " more waiting" : ""), href: "/spanish/#/homework/" + hw.id, cta: "Do it now" };
      } else if (!practised) {
        next = { what: "5-minute practice", sub: "Quick review of what you’re weakest on", href: "/spanish/#/practice/session?mode=quick5", cta: "Start" };
      } else if (!journaled) {
        next = { what: "Write today’s journal", sub: "A few sentences about your day, checked for mistakes", href: "/spanish/#/journal", cta: "Write" };
      } else {
        next = { what: "All done for today", sub: "¡Buen trabajo! See you tomorrow.", href: "/spanish/", cta: "Open Cuaderno" };
      }
      var check = function (done, label, meta, href) {
        return '<li><a href="' + href + '" class="' + (done ? "done" : "") + '"><span class="box">' + (done ? TICK : "") + '</span><span class="lbl">' + label + "</span>" +
          (meta ? '<span class="meta">' + meta + "</span>" : "") + "</a></li>";
      };
      box.innerHTML = '<p class="label" style="margin:0">Today’s Spanish</p>' +
        '<p class="what">' + esc(next.what.length > 120 ? next.what.slice(0, 117) + "…" : next.what) + "<small>" + esc(next.sub) + "</small></p>" +
        '<a class="pill-btn dark go" href="' + next.href + '">' + next.cta + "</a>" +
        '<ul class="checks">' +
          check(lessons > 0 && !homework.length, "Homework", homework.length ? homework.length + " open" : (lessons ? "Nothing due" : "No lessons yet"), homework.length ? "/spanish/#/homework/" + homework[0].id : "/spanish/#/lessons") +
          check(practised, "Practice", practised ? "Done today" : "", "/spanish/#/practice/session?mode=quick5") +
          check(journaled, "Journal", journaled ? "Written today" : "", "/spanish/#/journal") +
        "</ul>";
    }
    loadSpanish();
    // Refresh when you come back to this tab after doing the task
    document.addEventListener("visibilitychange", function () { if (!document.hidden) loadSpanish(); });

    // ---------- news ----------
    var NEWS_KEY = "home-news-topic";
    var topics = [], current = null;
    try { current = localStorage.getItem(NEWS_KEY); } catch (e) { /* ignore */ }
    function ago(isoStr) {
      if (!isoStr) return "";
      var m = Math.round((Date.now() - new Date(isoStr)) / 60000);
      if (m < 60) return Math.max(1, m) + "m ago";
      var h = Math.round(m / 60);
      if (h < 24) return h + "h ago";
      var d = Math.round(h / 24);
      return d === 1 ? "yesterday" : d + "d ago";
    }
    function story(i, lead) {
      var img = i.image
        ? '<img src="' + esc(i.image) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-source="' + esc(i.source) + '">'
        : '<span class="fallback">' + esc(i.source) + "</span>";
      return '<a class="story' + (lead ? " lead" : "") + '" href="' + esc(i.link) + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="img">' + img + "</div>" +
        '<div class="body"><span class="m"><b>' + esc(i.source) + "</b>" + (i.published ? "· " + ago(i.published) : "") + "</span>" +
        '<h3 class="t">' + esc(i.title) + "</h3>" +
        (lead && i.summary ? '<p class="s">' + esc(i.summary) + "</p>" : "") +
        "</div></a>";
    }
    function renderNews() {
      var t = topics.filter(function (x) { return x.id === current; })[0] || topics[0];
      if (!t) return;
      current = t.id;
      $("newsTabs").innerHTML = topics.map(function (x) {
        return '<button type="button" role="tab" data-topic="' + esc(x.id) + '" aria-selected="' + (x.id === current) + '">' + esc(x.label) + "</button>";
      }).join("");
      var box = $("news");
      box.removeAttribute("aria-busy");
      if (!t.items.length) { box.innerHTML = '<p class="news-msg">' + esc(t.error || "No headlines right now.") + "</p>"; return; }
      box.innerHTML = story(t.items[0], true) +
        (t.items.length > 1 ? '<div class="rest">' + t.items.slice(1).map(function (i) { return story(i, false); }).join("") + "</div>" : "");
      // A broken image becomes a neutral tile with the source name
      box.querySelectorAll(".story img").forEach(function (img) {
        img.addEventListener("error", function () {
          var f = document.createElement("span");
          f.className = "fallback";
          f.textContent = img.dataset.source || "";
          img.replaceWith(f);
        });
      });
    }
    $("newsTabs").addEventListener("click", function (e) {
      var b = e.target.closest("[data-topic]");
      if (!b) return;
      current = b.dataset.topic;
      try { localStorage.setItem(NEWS_KEY, current); } catch (err) { /* ignore */ }
      renderNews();
    });
    fetch("/api/news", { credentials: "same-origin" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { topics = j.topics || []; renderNews(); })
      .catch(function () {
        $("news").removeAttribute("aria-busy");
        $("news").innerHTML = '<p class="news-msg">Headlines load on nate-holland.com.</p>';
      });

    // For local previews/tests: window.NH_HOME.showNews(data)
    window.NH_HOME = { showNews: function (j) { topics = j.topics || []; renderNews(); } };
  })();
  </script>
</body>
</html>
