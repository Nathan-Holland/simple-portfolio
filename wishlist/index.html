<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Nate Holland | Wishlist</title>
  <link rel="icon" href="/wishlist/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/wishlist/styles.css?v=39" />
</head>
<body>
  <header class="top">
    <div class="site-menu" id="siteMenu">
      <button class="mark-btn" id="siteMenuBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="siteMenuList" aria-label="Open site menu">
        <span class="mark" aria-hidden="true"></span>
      </button>
      <ul class="sort-menu site-menu-list" id="siteMenuList" role="menu" hidden>
        <li role="none">
          <a role="menuitem" href="/">
            <svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 0L0 4V8L4 12H0V24L4 28H12V20L20 28H24L28 24V20L24 16H28V4L24 0H16V8L8 0H4Z" /></svg>
            <span>Portfolio</span>
          </a>
        </li>
      </ul>
    </div>
    <nav class="top-actions">
      <button class="icon-btn lock-btn view-only" id="signInBtn" type="button" aria-label="Sign in to edit" data-tip="Sign in to edit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" /><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" /></svg>
      </button>
      <button class="ghost edit-only remote-only" id="signOutBtn" type="button">Sign out</button>
      <button class="pill-btn edit-only" id="addBtn" type="button">
        <svg class="plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        Add item
      </button>
    </nav>
  </header>

  <section class="hero">
    <p class="eyebrow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg>
      <span id="updated">Personal wishlist</span>
    </p>
    <h1>Things I’m Pretending<br />I Don’t Want</h1>
  </section>

  <div class="toolbar">
    <div class="filters" id="filters" role="tablist" aria-label="Categories">
      <span class="indicator" aria-hidden="true"></span>
    </div>
    <div class="sort" id="sort">
      <button class="sort-btn" id="sortBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="sort-label">Sort by</span>
        <span id="sortValue">Most wanted</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
      </button>
      <ul class="sort-menu" id="sortMenu" role="listbox" hidden></ul>
    </div>
  </div>

  <main class="grid" id="grid"></main>
  <p class="empty" id="empty" hidden>Nothing here yet.</p>
  <div class="toast" id="toast" role="status" hidden></div>

  <!-- Detail -->
  <dialog id="detail" class="sheet detail-sheet" aria-labelledby="dName">
    <button class="close" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg>
    </button>
    <div class="detail">
      <div class="detail-media" id="dMedia"></div>
      <div class="detail-body">
        <div class="detail-tags" id="dTags"></div>
        <div class="detail-title">
          <p class="brand" id="dBrand"></p>
          <h2 id="dName"></h2>
          <p class="price" id="dPrice"></p>
        </div>
        <div class="facts" id="dFacts"></div>
        <section class="saver" id="dSaver" aria-labelledby="saverTitle">
          <div class="saver-head">
            <p class="notes-label" id="saverTitle">Save up for it</p>
            <div class="segmented" id="saverPeriods" role="radiogroup" aria-label="Save over">
              <span class="seg-indicator" aria-hidden="true"></span>
              <button type="button" role="radio" data-months="1">1 mo</button>
              <button type="button" role="radio" data-months="3">3 mo</button>
              <button type="button" role="radio" data-months="6">6 mo</button>
              <button type="button" role="radio" data-months="12">12 mo</button>
            </div>
          </div>
          <p class="saver-amount" aria-live="polite"><span id="saverMonthly">€0</span><span class="per"> / month</span></p>
          <p class="saver-sub" id="saverSub"></p>
        </section>
        <div class="notes" id="dNotesWrap">
          <p class="notes-label">Notes</p>
          <p id="dNotes"></p>
        </div>
        <div class="detail-actions">
          <a class="pill-btn dark visit" id="dLink" target="_blank" rel="noopener">
            Visit store
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8.5 7H17v8.5" /></svg>
          </a>
          <div class="icon-actions edit-only">
            <button class="icon-btn" id="dToggle" type="button"></button>
            <button class="icon-btn" id="dEdit" type="button" aria-label="Edit" data-tip="Edit">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16Z" /><path d="m13.5 6.5 4 4" /></svg>
            </button>
            <button class="icon-btn danger" id="dDelete" type="button" aria-label="Delete" data-tip="Delete">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M10 11v6M14 11v6M6 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5h6V7" /></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Add / edit -->
  <dialog id="editor" class="drawer" aria-labelledby="formTitle">
    <form id="form" method="dialog" class="drawer-form">
      <header class="drawer-head">
        <h2 id="formTitle">Add item</h2>
        <button class="close" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg></button>
      </header>
      <div class="drawer-body">
      <div class="fetch" id="fetchRow">
        <label>Paste a product link
          <div class="fetch-input">
            <input id="fetchUrl" type="url" placeholder="https://brand.com/products/…" />
            <button class="pill-btn dark" id="fetchBtn" type="button">Fetch</button>
          </div>
        </label>
        <p class="fetch-status" id="fetchStatus" aria-live="polite"></p>
      </div>
      <label>Name<input name="name" required /></label>
      <div class="row">
        <label>Brand<input name="brand" /></label>
        <label>Category<input name="category" list="cats" placeholder="Tops, Outerwear…" /></label>
      </div>
      <div class="row three">
        <label>Price (€)<input name="price" type="number" min="0" step="1" /></label>
        <label>Size<input name="size" /></label>
        <label>Desire
          <select name="priority">
            <option value="1">Really want</option>
            <option value="2" selected>Want</option>
            <option value="3">Nice to have</option>
          </select>
        </label>
      </div>
      <label>Image URL<input name="image" type="url" placeholder="https://…" /></label>
      <label>Product link<input name="link" type="url" placeholder="https://…" /></label>
      <label>Notes<textarea name="notes" rows="3"></textarea></label>
      <label class="check"><input name="bought" type="checkbox" /> Already bought</label>
      <datalist id="cats"></datalist>
      </div>
      <footer class="drawer-foot">
        <button class="ghost" type="button" data-close>Cancel</button>
        <button class="pill-btn dark" type="submit">Save</button>
      </footer>
    </form>
  </dialog>

  <!-- Sign in (unlocks editing) -->
  <dialog id="signIn" class="sheet signin" aria-labelledby="signInTitle">
    <form id="signInForm" class="signin-form">
      <button class="close" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg></button>
      <div class="signin-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" /><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" /></svg>
      </div>
      <h2 id="signInTitle">Edit the wishlist</h2>
      <p class="signin-sub">Enter the wishlist password to add and change items.</p>
      <label class="visually-hidden" for="signInPassword">Password</label>
      <input id="signInPassword" type="password" autocomplete="current-password" placeholder="Password" required />
      <p class="signin-error" id="signInError" aria-live="polite"></p>
      <button class="pill-btn dark" id="signInSubmit" type="submit">Unlock editing</button>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
  <script src="/wishlist/app.js?v=39"></script>
</body>
</html>
