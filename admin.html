<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Nate Holland — Admin</title>
<link rel="stylesheet" href="styles.css?v=61">
<link rel="icon" href="favicon.svg">
</head>
<body class="admin-page">

  <script>
    var dq = window.matchMedia("(prefers-color-scheme: dark)");
    var storedDark = localStorage.getItem("dark");
    document.body.classList.toggle("dark", storedDark === null ? dq.matches : storedDark === "1");
  </script>

  <header class="admin-header">
    <h1>Dashboard</h1>
    <a href="index.html">← Back to site</a>
  </header>

  <main class="admin-main">
    <div class="admin-stats">
      <div class="admin-stat-card">
        <span class="admin-stat-value" id="statCount">0</span>
        <span class="admin-stat-label">Projects</span>
      </div>
      <div class="admin-stat-card">
        <span class="admin-stat-value" id="statMedia">0</span>
        <span class="admin-stat-label">Media items</span>
      </div>
      <div class="admin-toolbar-actions">
        <span class="admin-status" id="adminStatus"></span>
        <button type="button" class="admin-save-btn" id="saveChangesBtn">Save changes</button>
      </div>
    </div>

    <p class="admin-hint">Changes here are local until you press Save changes — that's what updates the live site.</p>

    <div class="admin-grid" id="adminList"></div>

    <button type="button" class="admin-add-card" id="addProjectBtn">+ Add project</button>
  </main>

  <div class="admin-modal" id="projectForm" hidden>
    <div class="admin-modal-backdrop" id="projectFormBackdrop"></div>
    <form class="admin-form" id="projectFormEl">
      <h2 id="formTitle">Add project</h2>

      <label class="admin-field">
        Title
        <input type="text" id="fieldTitle" required>
      </label>

      <label class="admin-field">
        Client
        <input type="text" id="fieldClient" required>
      </label>

      <label class="admin-field">
        Partner
        <input type="text" id="fieldPartner" placeholder="Partner Name">
      </label>

      <label class="admin-field">
        Intro text (shown after the client name in the case study)
        <textarea id="fieldIntro" rows="3"></textarea>
      </label>

      <label class="admin-field">
        Tile size
        <select id="fieldSize">
          <option value="normal">Normal</option>
          <option value="large">Large</option>
        </select>
      </label>

      <div class="admin-field">
        <span>Media — the first item is the homepage tile / case-study hero (image or video), the rest fill the case-study gallery</span>
        <div class="admin-media-list" id="mediaList"></div>
        <label class="admin-media-add">
          + Add image or video
          <input type="file" id="fieldMediaInput" accept="image/*,video/*" hidden>
        </label>
        <span class="admin-upload-status" id="uploadStatus"></span>
      </div>

      <div class="admin-form-actions">
        <button type="button" id="cancelFormBtn">Cancel</button>
        <button type="submit" id="submitFormBtn">Save project</button>
      </div>
    </form>
  </div>

  <script src="admin.js?v=2"></script>
</body>
</html>
