<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Nate Holland — Admin</title>
<link rel="stylesheet" href="styles.css?v=66">
<link rel="icon" href="favicon.svg">
</head>
<body class="admin-page">

  <script>
    var dq = window.matchMedia("(prefers-color-scheme: dark)");
    var storedDark = localStorage.getItem("dark");
    document.body.classList.toggle("dark", storedDark === null ? dq.matches : storedDark === "1");
  </script>

  <header class="admin-header">
    <h1>Dashboard</h1>
    <a href="index.html">← Back to site</a>
  </header>

  <main class="admin-main">
    <div class="admin-stats">
      <div class="admin-stat-card">
        <span class="admin-stat-value" id="statCount">0</span>
        <span class="admin-stat-label">Projects</span>
      </div>
      <div class="admin-stat-card">
        <span class="admin-stat-value" id="statMedia">0</span>
        <span class="admin-stat-label">Media items</span>
      </div>
      <div class="admin-toolbar-actions">
        <span class="admin-status" id="adminStatus"></span>
        <button type="button" class="admin-save-btn" id="saveChangesBtn">Save changes</button>
      </div>
    </div>

    <p class="admin-hint">Changes here are local until you press Save changes — that's what updates the live site.</p>

    <div class="admin-grid" id="adminList"></div>

    <button type="button" class="admin-add-card" id="addProjectBtn">+ Add project</button>
  </main>

  <!-- Reuses the real case-study markup/classes (case-modal-hero, case-meta,
       case-intro, case-gallery) so this editor is styled identically to
       how the project actually renders on the live site — editing happens
       directly on the real-looking elements (contenteditable text,
       click-to-replace media) instead of a plain form. -->
  <div class="admin-editor" id="projectEditor" hidden>
    <header class="admin-editor-topbar">
      <button type="button" class="admin-editor-back" id="editorBackBtn">← Back</button>
      <input type="text" class="admin-editor-title-input" id="fieldTitle" placeholder="Project title (homepage tile caption)">
      <select class="admin-editor-size" id="fieldSize">
        <option value="normal">Normal tile</option>
        <option value="large">Large tile</option>
      </select>
      <span class="admin-upload-status" id="uploadStatus"></span>
      <button type="button" class="admin-editor-done" id="editorDoneBtn">Done</button>
    </header>

    <div class="admin-editor-preview">
      <div class="case-modal-hero admin-editor-hero" id="editorHero">
        <div class="case-modal-hero-media" id="editorHeroMedia"></div>
        <button type="button" class="admin-editor-media-btn admin-editor-hero-btn" id="editorHeroBtn">Change hero media</button>
        <input type="file" id="editorHeroInput" accept="image/*,video/*" hidden>
      </div>

      <div class="case-modal-body visible">
        <section class="case-meta grid14">
          <div class="case-meta-info">
            <p class="case-meta-year">© 2026</p>
            <div class="case-meta-item">
              <p class="case-meta-label">Client</p>
              <div class="case-meta-value-row">
                <button type="button" class="admin-editor-logo-btn" id="editorClientLogoBtn" title="Set client logo">
                  <img class="case-meta-logo" id="editorClientLogo" alt="" hidden>
                  <span class="admin-editor-logo-placeholder">+</span>
                </button>
                <input type="file" id="editorClientLogoInput" accept="image/*" hidden>
                <p class="case-meta-value" contenteditable="true" id="editorClient" data-placeholder="Client Name"></p>
              </div>
            </div>
            <div class="case-meta-divider"></div>
            <div class="case-meta-item">
              <p class="case-meta-label">Partner</p>
              <div class="case-meta-value-row">
                <button type="button" class="admin-editor-logo-btn" id="editorPartnerLogoBtn" title="Set partner logo">
                  <img class="case-meta-logo" id="editorPartnerLogo" alt="" hidden>
                  <span class="admin-editor-logo-placeholder">+</span>
                </button>
                <input type="file" id="editorPartnerLogoInput" accept="image/*" hidden>
                <p class="case-meta-value" contenteditable="true" id="editorPartner" data-placeholder="Partner Name"></p>
              </div>
            </div>
          </div>
          <div class="admin-editor-intro-wrap">
            <div class="admin-editor-intro-toolbar">
              <span>Select a word in the intro, then:</span>
              <button type="button" class="admin-text-btn" id="introGreyBtn">Grey out</button>
              <button type="button" class="admin-text-btn" id="introClearBtn">Clear</button>
            </div>
            <p class="case-intro" contenteditable="true" id="editorIntro" data-placeholder="Intro text about the project — select a word above to grey it out"></p>
          </div>
        </section>

        <section class="case-gallery dynamic" id="editorGallery"></section>
      </div>
    </div>
  </div>

  <script src="admin.js?v=5"></script>
</body>
</html>
